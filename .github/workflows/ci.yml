name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # La logica di dominio compila e si testa ovunque: è la rete di sicurezza
  # veloce su ogni push.
  core-tests:
    name: Test del core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p win-buddy-core
      - run: cargo clippy -p win-buddy-core -- -D warnings

  # La piattaforma di destinazione è Windows 11 (§ 2): qui si compila la
  # shell vera, si rieseguono i test e si produce l'installer NSIS.
  windows-build:
    name: Build Windows + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
      - name: Build Tauri (NSIS)
        run: npx tauri build
      - name: Carica l'installer
        uses: actions/upload-artifact@v4
        with:
          name: win-buddy-installer
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
