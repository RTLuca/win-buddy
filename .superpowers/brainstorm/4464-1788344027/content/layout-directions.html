<style>
  #p0-directions {
    --wb-bg: light-dark(#f4f1f8, #17141f);
    --wb-panel: light-dark(#fffdfd, #211d2b);
    --wb-panel-2: light-dark(#eee9f4, #2b2637);
    --wb-line: light-dark(#d9d0e2, #443b55);
    --wb-text: light-dark(#241d2e, #f5effc);
    --wb-muted: light-dark(#71687b, #bcb2c8);
    --wb-purple: light-dark(#7863a8, #bba6eb);
    --wb-green: light-dark(#438d73, #62b796);
    --wb-blue: light-dark(#4c87a8, #83c4e9);
    color: var(--wb-text);
  }
  #p0-directions .direction-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  #p0-directions .direction {
    appearance: none;
    width: 100%;
    padding: 0;
    border: 1px solid var(--wb-line);
    border-radius: 16px;
    background: transparent;
    color: inherit;
    text-align: left;
    overflow: hidden;
    cursor: pointer;
  }
  #p0-directions .direction:hover {
    border-color: var(--wb-purple);
  }
  #p0-directions .direction.is-selected {
    border-color: var(--wb-purple);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--wb-purple) 24%, transparent);
  }
  #p0-directions .preview {
    min-height: 325px;
    padding: 13px;
    background: var(--wb-bg);
  }
  #p0-directions .window {
    min-height: 294px;
    border-radius: 13px;
    background: var(--wb-panel);
    box-shadow: 0 16px 35px color-mix(in srgb, var(--wb-text) 11%, transparent);
    overflow: hidden;
  }
  #p0-directions .winbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--wb-line);
    color: var(--wb-muted);
    font-size: 11px;
  }
  #p0-directions .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--wb-text);
    font-weight: 600;
  }
  #p0-directions .buddy-dot {
    width: 15px;
    height: 15px;
    border-radius: 50% 50% 46% 54%;
    background: var(--wb-purple);
    box-shadow: inset -3px -3px 0 color-mix(in srgb, var(--wb-text) 12%, transparent);
  }
  #p0-directions .tabs {
    display: flex;
    gap: 13px;
    padding: 9px 12px 0;
    color: var(--wb-muted);
    font-size: 10px;
  }
  #p0-directions .tabs span.active {
    color: var(--wb-text);
    border-bottom: 2px solid var(--wb-purple);
    padding-bottom: 7px;
  }
  #p0-directions .focus-body {
    display: grid;
    gap: 9px;
    padding: 14px;
  }
  #p0-directions .eyebrow {
    color: var(--wb-muted);
    font-size: 9px;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  #p0-directions .intent {
    padding: 11px 12px;
    border: 1px solid var(--wb-line);
    border-radius: 9px;
    color: var(--wb-text);
    font-size: 11px;
  }
  #p0-directions .preset-row,
  #p0-directions .action-row,
  #p0-directions .mini-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  #p0-directions .chip {
    padding: 5px 7px;
    border-radius: 999px;
    background: var(--wb-panel-2);
    color: var(--wb-muted);
    font-size: 9px;
  }
  #p0-directions .chip.on {
    background: var(--wb-purple);
    color: var(--wb-panel);
  }
  #p0-directions .primary-action {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 9px 12px;
    border-radius: 9px;
    background: var(--wb-text);
    color: var(--wb-panel);
    font-size: 11px;
    font-weight: 600;
  }
  #p0-directions .soft-action {
    padding: 7px 9px;
    border-radius: 8px;
    background: var(--wb-panel-2);
    color: var(--wb-text);
    font-size: 9px;
  }
  #p0-directions .divider {
    height: 1px;
    background: var(--wb-line);
  }
  #p0-directions .active-strip {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--wb-green) 13%, var(--wb-panel));
  }
  #p0-directions .clock {
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  #p0-directions .tiny-copy {
    color: var(--wb-muted);
    font-size: 8px;
  }
  #p0-directions .rail-shell {
    display: grid;
    grid-template-columns: 74px 1fr;
    min-height: 294px;
  }
  #p0-directions .rail {
    padding: 13px 9px;
    background: var(--wb-panel-2);
    color: var(--wb-muted);
    font-size: 9px;
  }
  #p0-directions .rail .rail-item {
    margin: 0 0 11px;
  }
  #p0-directions .rail .rail-item.on {
    color: var(--wb-text);
    font-weight: 600;
  }
  #p0-directions .cockpit {
    display: grid;
    grid-template-columns: 1fr 80px;
    gap: 10px;
    padding: 13px;
  }
  #p0-directions .dial {
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    margin: 4px auto 10px;
    border-radius: 50%;
    background: conic-gradient(var(--wb-green) 0 72%, var(--wb-panel-2) 72% 100%);
  }
  #p0-directions .dial::after {
    content: "18:42";
    display: grid;
    place-items: center;
    width: 61px;
    height: 61px;
    border-radius: 50%;
    background: var(--wb-panel);
    font-size: 13px;
    font-weight: 600;
  }
  #p0-directions .side-stack {
    display: grid;
    gap: 7px;
    align-content: start;
  }
  #p0-directions .side-box {
    padding: 8px;
    border-radius: 8px;
    background: var(--wb-panel-2);
    font-size: 8px;
    color: var(--wb-muted);
  }
  #p0-directions .desktop {
    position: relative;
    min-height: 294px;
    background:
      linear-gradient(140deg, color-mix(in srgb, var(--wb-purple) 16%, var(--wb-bg)), var(--wb-bg) 54%),
      var(--wb-bg);
    overflow: hidden;
  }
  #p0-directions .fake-app {
    position: absolute;
    inset: 25px 48px 43px 18px;
    border-radius: 9px;
    background: var(--wb-panel);
    opacity: .78;
    box-shadow: 0 12px 30px color-mix(in srgb, var(--wb-text) 8%, transparent);
  }
  #p0-directions .fake-lines {
    display: grid;
    gap: 9px;
    padding: 18px;
  }
  #p0-directions .fake-lines span {
    height: 7px;
    border-radius: 4px;
    background: var(--wb-panel-2);
  }
  #p0-directions .fake-lines span:nth-child(2) { width: 72%; }
  #p0-directions .fake-lines span:nth-child(3) { width: 86%; }
  #p0-directions .buddy {
    position: absolute;
    right: 18px;
    bottom: 38px;
    width: 48px;
    height: 56px;
    border-radius: 48% 52% 42% 45%;
    background: var(--wb-purple);
    box-shadow: 0 11px 20px color-mix(in srgb, var(--wb-text) 18%, transparent);
  }
  #p0-directions .buddy::before,
  #p0-directions .buddy::after {
    content: "";
    position: absolute;
    top: -9px;
    width: 18px;
    height: 23px;
    border-radius: 70% 20% 60% 30%;
    background: var(--wb-purple);
  }
  #p0-directions .buddy::before { left: 2px; transform: rotate(-22deg); }
  #p0-directions .buddy::after { right: 2px; transform: scaleX(-1) rotate(-22deg); }
  #p0-directions .floating-bar {
    position: absolute;
    right: 17px;
    bottom: 17px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 9px;
    border-radius: 12px;
    background: var(--wb-panel);
    box-shadow: 0 12px 30px color-mix(in srgb, var(--wb-text) 18%, transparent);
    font-size: 9px;
  }
  #p0-directions .floating-clock {
    color: var(--wb-green);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #p0-directions .float-control {
    padding: 4px 6px;
    border-radius: 6px;
    background: var(--wb-panel-2);
  }
  #p0-directions .quick-capture {
    position: absolute;
    left: 34px;
    right: 72px;
    bottom: 18px;
    padding: 8px 9px;
    border-radius: 9px;
    background: var(--wb-panel);
    color: var(--wb-muted);
    box-shadow: 0 12px 30px color-mix(in srgb, var(--wb-text) 14%, transparent);
    font-size: 9px;
  }
  #p0-directions .direction-copy {
    min-height: 126px;
    padding: 14px 15px 16px;
    border-top: 1px solid var(--wb-line);
    background: var(--wb-panel);
  }
  #p0-directions .direction-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
  }
  #p0-directions .direction-title strong {
    font-size: 14px;
  }
  #p0-directions .recommend {
    padding: 3px 6px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--wb-green) 18%, var(--wb-panel));
    color: var(--wb-green);
    font-size: 9px;
  }
  #p0-directions .direction-copy p {
    margin: 0;
    color: var(--wb-muted);
    font-size: 11px;
    line-height: 1.45;
  }
  #p0-directions .tradeoff {
    display: block;
    margin-top: 7px;
    color: var(--wb-text);
  }
  @media (max-width: 820px) {
    #p0-directions .direction-grid { grid-template-columns: 1fr; }
    #p0-directions .preview { min-height: 260px; }
    #p0-directions .window,
    #p0-directions .desktop,
    #p0-directions .rail-shell { min-height: 230px; }
  }
</style>

<div id="p0-directions">
  <h2>Dove devono vivere i nuovi controlli P0?</h2>
  <p class="subtitle">Tre architetture possibili. Seleziona quella da sviluppare nei mockup di dettaglio.</p>

  <div class="direction-grid">
    <button class="direction" type="button" data-choice="rituale-compatto" onclick="toggleSelect(this)" aria-label="Opzione A, Rituale compatto">
      <div class="preview">
        <div class="window">
          <div class="winbar">
            <span class="brand"><span class="buddy-dot"></span> Win Buddy</span>
            <span>— □ ×</span>
          </div>
          <div class="tabs"><span>Aperte</span><span>Archivio</span><span class="active">Focus</span><span>Impostazioni</span></div>
          <div class="focus-body">
            <span class="eyebrow">La prossima sessione</span>
            <div class="intent">Chiudere la struttura del report</div>
            <div class="preset-row"><span class="chip on">Classico · 25</span><span class="chip">Deep · 50</span><span class="chip">Flowtime</span><span class="chip">Altro</span></div>
            <div class="primary-action">Avvia focus</div>
            <div class="divider"></div>
            <div class="active-strip">
              <span class="buddy-dot"></span>
              <span><span class="clock">18:42</span><br><span class="tiny-copy">Struttura del report</span></span>
              <span class="action-row"><span class="soft-action">Pausa</span><span class="soft-action">+5</span></span>
            </div>
          </div>
        </div>
      </div>
      <div class="direction-copy">
        <div class="direction-title"><strong>A · Rituale compatto</strong><span class="recommend">Raccomandato</span></div>
        <p>Conserva l'app attuale. Il tab Focus diventa un percorso in stati: prepara, lavora, chiudi, pausa.<span class="tradeoff">Più semplice da capire e da sviluppare; analytics in una vista secondaria.</span></p>
      </div>
    </button>

    <button class="direction" type="button" data-choice="focus-cockpit" onclick="toggleSelect(this)" aria-label="Opzione B, Focus cockpit">
      <div class="preview">
        <div class="window">
          <div class="winbar"><span class="brand"><span class="buddy-dot"></span> Win Buddy</span><span>— □ ×</span></div>
          <div class="rail-shell">
            <div class="rail"><div class="rail-item on">Focus</div><div class="rail-item">Pianifica</div><div class="rail-item">Storico</div><div class="rail-item">Insight</div><div class="rail-item">Note</div></div>
            <div class="cockpit">
              <div class="focus-body">
                <span class="eyebrow">Focus in corso</span>
                <div class="dial"></div>
                <div class="intent">Chiudere la struttura del report</div>
                <div class="action-row"><span class="soft-action">Pausa</span><span class="soft-action">+5</span><span class="soft-action">Concludi</span></div>
              </div>
              <div class="side-stack">
                <div class="side-box">3 / 4<br><strong>ciclo</strong></div>
                <div class="side-box">2<br><strong>catture</strong></div>
                <div class="side-box">DND<br><strong>attivo</strong></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="direction-copy">
        <div class="direction-title"><strong>B · Focus cockpit</strong></div>
        <p>Trasforma il pannello in un centro di controllo con navigazione propria e più dati simultanei.<span class="tradeoff">Potente e scalabile, ma rischia di assomigliare a una suite di produttività.</span></p>
      </div>
    </button>

    <button class="direction" type="button" data-choice="buddy-first" onclick="toggleSelect(this)" aria-label="Opzione C, Buddy first">
      <div class="preview">
        <div class="window">
          <div class="desktop">
            <div class="fake-app"><div class="fake-lines"><span></span><span></span><span></span><span></span></div></div>
            <div class="quick-capture">Annota una distrazione… <strong>Invio</strong></div>
            <div class="buddy"></div>
            <div class="floating-bar"><span class="floating-clock">18:42</span><span class="float-control">Ⅱ</span><span class="float-control">+5</span><span class="float-control">✓</span></div>
          </div>
        </div>
      </div>
      <div class="direction-copy">
        <div class="direction-title"><strong>C · Buddy-first</strong></div>
        <p>Quasi tutto avviene accanto alla creatura; il pannello serve solo per configurare e analizzare.<span class="tradeoff">Massima identità, ma l'overlay può diventare troppo interattivo e invasivo.</span></p>
      </div>
    </button>
  </div>
</div>
