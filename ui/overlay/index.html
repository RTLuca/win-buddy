<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>win-buddy · overlay</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body class="overlay-body">
    <div id="stage"></div>

    <!-- barra rapida: compare al passaggio del mouse sulla creatura -->
    <div id="quickbar" class="quickbar">
      <button type="button" id="qbNote" title="Nuova nota (Ctrl+Alt+Spazio)">✎</button>
      <button type="button" id="qbPomo" class="go" title="Avvia un focus">▶</button>
      <button type="button" id="qbPanel" title="Apri il pannello">☰</button>
    </div>

    <!-- modalità sobria: una pillola, nessun canvas (§ 9.3) -->
    <div id="sober" class="sober">
      <span class="led" id="soberLed"></span>
      <span><span class="lbl" id="soberLbl">pronto</span> <span id="soberTime"></span></span>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
