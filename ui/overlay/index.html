<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>win-buddy · overlay</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body class="overlay-body">
    <div id="stage"></div>

    <div id="sober" class="focus-hud">
      <span class="led" id="soberLed" aria-hidden="true"></span>
      <output id="focusChip" class="focus-chip" aria-live="off">Focus in caricamento</output>
    </div>

    <!-- Dock focus: entra nella hitbox soltanto durante hover o focus interno. -->
    <div id="actionDock" class="action-dock" inert>
      <div id="focusActions" class="focus-actions" role="group" aria-label="Azioni focus"></div>

      <div
        id="finishChooser"
        class="finish-chooser"
        role="group"
        aria-label="Esito del focus"
        hidden
        inert
      >
        <button type="button" data-focus-outcome="completed">Completata</button>
        <button type="button" data-focus-outcome="partial">Parziale</button>
        <button type="button" data-focus-outcome="interrupted">Interrotta</button>
      </div>

      <div id="quickbar" class="quickbar" role="group" aria-label="Utility buddy">
        <button
          type="button"
          id="qbMove"
          class="drag-handle"
          title="Sposta il buddy: trascina o usa le frecce"
          aria-label="Sposta il buddy: trascina o usa i tasti freccia"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v18M3 12h18M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3" />
          </svg>
        </button>
        <button type="button" id="qbPanel" title="Apri il pannello" aria-label="Apri il pannello">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h14v14H5zM9 5v14M12 9h4M12 13h4" />
          </svg>
        </button>
        <button
          type="button"
          id="qbScale"
          title="Ridimensiona il buddy"
          aria-label="Ridimensiona il buddy"
          aria-controls="scalePopover"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 21h5v-5M3 8l6-6M21 16l-6 6" />
          </svg>
        </button>
      </div>

      <p id="focusFeedback" class="focus-feedback" role="status" hidden></p>

      <div
        id="scalePopover"
        class="scale-popover"
        role="group"
        aria-label="Dimensione del buddy"
        hidden
        inert
      >
        <div class="scale-head">
          <span>Dimensione</span>
          <output id="quickScaleVal" for="quickScale">100%</output>
        </div>
        <div class="scale-controls">
          <button type="button" id="scaleDown" aria-label="Riduci dimensione">−</button>
          <input
            type="range"
            id="quickScale"
            min="50"
            max="200"
            step="10"
            value="100"
            aria-label="Dimensione del buddy in percentuale"
          />
          <button type="button" id="scaleUp" aria-label="Aumenta dimensione">+</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
