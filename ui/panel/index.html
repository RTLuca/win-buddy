<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>win-buddy · pannello</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body class="panel-body">
    <header class="head">
      <nav class="tabs" id="tabs">
        <button type="button" data-tab="open" class="on">Aperte</button>
        <button type="button" data-tab="archive">Archivio</button>
        <button type="button" data-tab="focus">Focus</button>
        <button type="button" data-tab="settings">Impostazioni</button>
      </nav>
    </header>

    <!-- ------------------------------------------------ note aperte -->
    <section id="tab-open" class="tab on">
      <form id="newNote" class="new-note">
        <input
          id="newNoteText"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Nuova nota… (es. «preventivo giovedì 9»)"
        />
      </form>
      <div id="openList" class="list"></div>
      <footer class="foot" id="openFoot"></footer>
    </section>

    <!-- --------------------------------------------------- archivio -->
    <section id="tab-archive" class="tab">
      <input
        id="searchBox"
        class="search"
        type="search"
        placeholder="Cerca nelle note…  ⌕"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="archiveList" class="list"></div>
    </section>

    <!-- ------------------------------------------------------- focus -->
    <section id="tab-focus" class="tab focus-tab">
      <nav id="focusTabs" class="focus-tabs" aria-label="Viste Focus" role="tablist">
        <button
          id="focusTabPrepare"
          type="button"
          role="tab"
          data-focus-pane="prepare"
          aria-controls="focusPrepare"
          aria-selected="true"
        >Prepara</button>
        <button
          id="focusTabHistory"
          type="button"
          role="tab"
          data-focus-pane="history"
          aria-controls="focusHistory"
          aria-selected="false"
          tabindex="-1"
        >Registro</button>
        <button
          id="focusTabStats"
          type="button"
          role="tab"
          data-focus-pane="stats"
          aria-controls="focusStats"
          aria-selected="false"
          tabindex="-1"
        >Statistiche</button>
      </nav>

      <section
        id="focusPrepare"
        class="focus-pane"
        role="tabpanel"
        aria-labelledby="focusTabPrepare"
      >
        <div id="focusPrepareState" class="focus-state" role="status">
          <span class="focus-skeleton wide"></span>
          <span class="focus-skeleton"></span>
          <span class="sr-only">Caricamento focus</span>
        </div>

        <form id="focusPrepareForm" class="focus-form" hidden>
          <label class="focus-field">
            <span>Alla fine avrò…</span>
            <textarea
              id="focusIntention"
              rows="2"
              maxlength="240"
              spellcheck="true"
              placeholder="Descrivi il risultato della sessione"
            ></textarea>
          </label>

          <label class="focus-field">
            <span>Preset</span>
            <select id="focusPreset"></select>
            <small id="focusPresetHint">Durata e pause arrivano dal preset salvato.</small>
          </label>

          <div class="focus-field-grid">
            <label class="focus-field">
              <span>Durata una tantum</span>
              <span class="focus-number-wrap">
                <input id="focusDuration" type="number" min="1" max="720" inputmode="numeric" />
                <span>min</span>
              </span>
            </label>
            <label class="focus-field">
              <span>Stima</span>
              <span class="focus-number-wrap">
                <input id="focusEstimate" type="number" min="1" max="1440" inputmode="numeric" />
                <span>min</span>
              </span>
            </label>
          </div>

          <label class="focus-field">
            <span>Categoria</span>
            <input id="focusCategory" type="text" maxlength="80" autocomplete="off" />
          </label>

          <label class="focus-field">
            <span>Prossimo passo</span>
            <input id="focusNextStep" type="text" maxlength="240" autocomplete="off" />
          </label>

          <button type="submit" id="focusStart" class="primary focus-start">Avvia focus</button>
        </form>

        <div id="focusRunning" class="focus-running" hidden></div>
        <p id="focusError" class="focus-error" role="alert" hidden></p>
      </section>

      <section
        id="focusHistory"
        class="focus-pane"
        role="tabpanel"
        aria-labelledby="focusTabHistory"
        hidden
      >
        <div class="focus-pane-head">
          <div>
            <p class="focus-eyebrow">Dati locali</p>
            <h2>Registro</h2>
          </div>
          <button type="button" id="focusHistoryRefresh" class="ghost compact">Aggiorna</button>
        </div>
        <div id="focusHistoryContent" class="focus-history" aria-live="polite">
          <div class="focus-state">Caricamento registro…</div>
        </div>
      </section>

      <section
        id="focusStats"
        class="focus-pane"
        role="tabpanel"
        aria-labelledby="focusTabStats"
        hidden
      >
        <div class="focus-pane-head">
          <div>
            <p class="focus-eyebrow">Periodo caricato</p>
            <h2>Statistiche</h2>
          </div>
        </div>
        <div id="focusStatsContent" class="focus-stats" aria-live="polite">
          <div class="focus-state">Caricamento statistiche…</div>
        </div>
      </section>
    </section>

    <!-- ----------------------------------------------- impostazioni -->
    <section id="tab-settings" class="tab">
      <h3 class="section-title">Creatura</h3>
      <div id="creatures" class="creatures"></div>

      <h3 class="section-title">Overlay</h3>
      <div class="form">
        <label class="row">
          <span>Modalità sobria (pillola, niente 3D)</span>
          <input type="checkbox" id="setSober" />
        </label>
        <label class="row">
          <span>Dimensione del companion <span class="hint-val" id="scaleVal"></span></span>
          <input type="range" id="setScale" min="50" max="200" step="10" />
        </label>
        <label class="row">
          <span>Schermo</span>
          <select id="setMonitor"></select>
        </label>
        <label class="row">
          <span>Angolo dello schermo</span>
          <select id="setCorner">
            <option value="bottom-right">basso a destra</option>
            <option value="bottom-left">basso a sinistra</option>
            <option value="top-right">alto a destra</option>
            <option value="top-left">alto a sinistra</option>
          </select>
        </label>
        <div class="row position-reset-row">
          <span>
            Posizione manuale
            <small>Riporta il buddy all’angolo selezionato</small>
          </span>
          <span class="position-reset-action">
            <span id="positionResetStatus" class="inline-status" aria-live="polite"></span>
            <button type="button" id="resetPosition" class="ghost compact">Ripristina</button>
          </span>
        </div>
        <label class="row">
          <span>DND automatico su fullscreen e presentazioni</span>
          <input type="checkbox" id="setAutoDnd" />
        </label>
        <label class="row">
          <span>Spegni l'overlay dopo (minuti di inattività)</span>
          <input type="number" id="setIdleSleep" min="1" max="240" />
        </label>
      </div>

      <h3 class="section-title">Pomodoro</h3>
      <div class="form">
        <label class="row">
          <span>Focus (minuti)</span>
          <input type="number" id="setFocus" min="5" max="120" />
        </label>
        <label class="row">
          <span>Pausa breve (minuti)</span>
          <input type="number" id="setShort" min="1" max="60" />
        </label>
        <label class="row">
          <span>Pausa lunga (minuti)</span>
          <input type="number" id="setLong" min="5" max="90" />
        </label>
        <label class="row">
          <span>Pausa lunga ogni (sessioni)</span>
          <input type="number" id="setEvery" min="2" max="12" />
        </label>
      </div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
